<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Power market modelling workflow</title><desc id="desc">Six-stage workflow from copper-plate energy clearing through storage, nodal and zonal congestion, balancing and reserve markets.</desc>
<rect width="1200" height="620" fill="#ffffff"/>

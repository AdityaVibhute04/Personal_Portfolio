<text x="305" y="414" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#777">24-hour arbitrage</text><circle cx="500" cy="310" r="36" fill="#ffffff" stroke="#222" stroke-width="3"/>
<text x="500" y="318" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#222">03</text>
<text x="500" y="385" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#222">Nodal</text>
<text x="500" y="414" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#777">LMP & congestion</text><circle cx="695" cy="310" r="36" fill="#ffffff" stroke="#222" stroke-width="3"/>

<text x="70" y="120" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#666">IEEE RTS-96 · PyPSA / HiGHS · market clearing → network constraints → ancillary services</text>
<line x1="105" y1="310" x2="1095" y2="310" stroke="#c8c8c8" stroke-width="4"/>
<circle cx="110" cy="310" r="36" fill="#ffffff" stroke="#222" stroke-width="3"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Sequential and joint reserve-market comparison</title><desc id="desc">Joint energy and reserve clearing reduced combined cost by 694.75 dollars relative to sequential clearing in the assignment case.</desc><rect width="1200" height="560" fill="#fff"/><text x="80" y="65" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#151515">Reserve procurement: sequential vs joint clearing</text>
<rect x="80" y="120" width="500" height="330" fill="#f5f5f2" stroke="#d8d8d3"/><text x="115" y="165" font-family="Arial" font-size="22" font-weight="700" fill="#222">Sequential</text><text x="115" y="210" font-family="Arial" font-size="16" fill="#555">Day-ahead electricity price</text><text x="525" y="210" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#222">$20.93/MWh</text><text x="115" y="255" font-family="Arial" font-size="16" fill="#555">Energy production cost</text><text x="525" y="255" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#222">$20,023.12</text><text x="115" y="300" font-family="Arial" font-size="16" fill="#555">Reserve offer cost</text><text x="525" y="300" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#222">$1,862.40</text><line x1="115" y1="330" x2="525" y2="330" stroke="#bbb"/><text x="115" y="375" font-family="Arial" font-size="17" font-weight="700" fill="#333">Combined cost</text><text x="525" y="375" text-anchor="end" font-family="Arial" font-size="23" font-weight="700" fill="#111">$21,885.53</text>
<rect x="620" y="120" width="500" height="330" fill="#f5f5f2" stroke="#d8d8d3"/><text x="655" y="165" font-family="Arial" font-size="22" font-weight="700" fill="#222">Joint energy + reserve</text><text x="655" y="210" font-family="Arial" font-size="16" fill="#555">Day-ahead electricity price</text><text x="1065" y="210" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#222">$20.70/MWh</text><text x="655" y="255" font-family="Arial" font-size="16" fill="#555">Energy production cost</text><text x="1065" y="255" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#222">$19,283.74</text><text x="655" y="300" font-family="Arial" font-size="16" fill="#555">Reserve offer cost</text><text x="1065" y="300" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" fill="#222">$1,907.04</text><line x1="655" y1="330" x2="1065" y2="330" stroke="#bbb"/><text x="655" y="375" font-family="Arial" font-size="17" font-weight="700" fill="#333">Combined cost</text><text x="1065" y="375" text-anchor="end" font-family="Arial" font-size="23" font-weight="700" fill="#111">$21,190.78</text><text x="80" y="505" font-family="Arial" font-size="18" font-weight="700" fill="#222">Modelled saving from joint clearing: $694.75</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Effect of interzonal transfer capacity on zonal prices</title><desc id="desc">As ATC increases, the large price spread collapses and both zones converge to 20.7 dollars per megawatt-hour by 400 megawatts.</desc><rect width="1200" height="620" fill="#fff"/><text x="100" y="55" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#151515">Interzonal ATC sensitivity</text><line x1="100" y1="525.0" x2="1140" y2="525.0" stroke="#e4e4e0"/><text x="85" y="530.0" text-anchor="end" font-family="Arial" font-size="14" fill="#777">0</text><line x1="100" y1="443.3" x2="1140" y2="443.3" stroke="#e4e4e0"/><text x="85" y="448.3" text-anchor="end" font-family="Arial" font-size="14" fill="#777">100</text><line x1="100" y1="361.5" x2="1140" y2="361.5" stroke="#e4e4e0"/><text x="85" y="366.5" text-anchor="end" font-family="Arial" font-size="14" fill="#777">200</text><line x1="100" y1="279.8" x2="1140" y2="279.8" stroke="#e4e4e0"/><text x="85" y="284.8" text-anchor="end" font-family="Arial" font-size="14" fill="#777">300</text><line x1="100" y1="198.1" x2="1140" y2="198.1" stroke="#e4e4e0"/><text x="85" y="203.1" text-anchor="end" font-family="Arial" font-size="14" fill="#777">400</text><line x1="100" y1="116.3" x2="1140" y2="116.3" stroke="#e4e4e0"/><text x="85" y="121.3" text-anchor="end" font-family="Arial" font-size="14" fill="#777">500</text><text x="100.0" y="553" text-anchor="middle" font-family="Arial" font-size="13" fill="#777">0</text><text x="273.3" y="553" text-anchor="middle" font-family="Arial" font-size="13" fill="#777">400</text><text x="446.7" y="553" text-anchor="middle" font-family="Arial" font-size="13" fill="#777">800</text><text x="620.0" y="553" text-anchor="middle" font-family="Arial" font-size="13" fill="#777">1200</text><text x="793.3" y="553" text-anchor="middle" font-family="Arial" font-size="13" fill="#777">1600</text><text x="966.7" y="553" text-anchor="middle" font-family="Arial" font-size="13" fill="#777">2000</text><text x="1140.0" y="553" text-anchor="middle" font-family="Arial" font-size="13" fill="#777">2400</text><polyline points="100.0,116.3 143.3,116.3 186.7,116.3 230.0,116.3 251.7,508.1 273.3,508.1 360.0,508.1 533.3,508.1 1140.0,508.1" fill="none" stroke="#333" stroke-width="4"/><polyline points="100.0,516.4 143.3,516.4 186.7,516.1 230.0,516.1 251.7,516.1 273.3,508.1 360.0,508.1 533.3,508.1 1140.0,508.1" fill="none" stroke="#888" stroke-width="4" stroke-dasharray="10 7"/><circle cx="100.0" cy="116.3" r="5" fill="#333"/><circle cx="143.3" cy="116.3" r="5" fill="#333"/><circle cx="186.7" cy="116.3" r="5" fill="#333"/><circle cx="230.0" cy="116.3" r="5" fill="#333"/><circle cx="251.7" cy="508.1" r="5" fill="#333"/><circle cx="273.3" cy="508.1" r="5" fill="#333"/><circle cx="360.0" cy="508.1" r="5" fill="#333"/><circle cx="533.3" cy="508.1" r="5" fill="#333"/><circle cx="1140.0" cy="508.1" r="5" fill="#333"/><circle cx="100.0" cy="516.4" r="5" fill="#888"/><circle cx="143.3" cy="516.4" r="5" fill="#888"/><circle cx="186.7" cy="516.1" r="5" fill="#888"/><circle cx="230.0" cy="516.1" r="5" fill="#888"/><circle cx="251.7" cy="516.1" r="5" fill="#888"/><circle cx="273.3" cy="508.1" r="5" fill="#888"/><circle cx="360.0" cy="508.1" r="5" fill="#888"/><circle cx="533.3" cy="508.1" r="5" fill="#888"/><circle cx="1140.0" cy="508.1" r="5" fill="#888"/><line x1="800" y1="80" x2="850" y2="80" stroke="#333" stroke-width="4"/><text x="862" y="86" font-family="Arial" font-size="14" fill="#444">Zone A</text><line x1="950" y1="80" x2="1000" y2="80" stroke="#888" stroke-width="4" stroke-dasharray="10 7"/><text x="1012" y="86" font-family="Arial" font-size="14" fill="#444">Zone B</text><text x="620.0" y="592" text-anchor="middle" font-family="Arial" font-size="15" fill="#555">Interzonal ATC (MW)</text><text x="30" y="312.5" transform="rotate(-90 30 312.5)" text-anchor="middle" font-family="Arial" font-size="15" fill="#555">Zonal price ($/MWh)</text><text x="760" y="515" font-family="Arial" font-size="15" fill="#555">Price convergence occurs by ≈400 MW ATC in this stylised case.</text></svg>